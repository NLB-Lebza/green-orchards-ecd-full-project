<div class="login-page">
    <section class="login-visual">
        <div class="visual-content"><span class="eyebrow">GREEN ORCHARDS ECD CENTER</span>
            <h1>Admin Access,<span>Manage the Center</span></h1>
            <p>Review accounts, monitor enrollments, and oversee the children registered at the center.</p>
        </div>
    </section>
    <section class="login-section">
        <div class="login-card">
            <div class="logo">
                <div class="logo-tree">🌳</div>
                <div>
                    <h2>ADMIN</h2>
                    <h2>PORTAL</h2><span>SECURE LOGIN</span>
                </div>
            </div>
            <div class="login-heading">
                <h1>Welcome Admin</h1>
                <p>Sign in to access the management dashboard</p>
            </div>
            <form (ngSubmit)="login()">
                <div class="form-group"><label>Email</label><input type="email" [(ngModel)]="email" name="email" placeholder="Enter admin email"></div>
                <div class="form-group"><label>Password</label>
                    <div class="password-row"><input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" placeholder="Enter password"><button type="button" (click)="togglePassword()">{{ showPassword ? 'Hide' : 'Show' }}</button></div>
                </div>
                @if(errorMessage){<div class="message error">{{errorMessage}}</div>}
                <button class="login-button" type="submit">🔐 Sign In</button>
            </form>
            <div class="login-footer"><a routerLink="/login">Back to staff login</a></div>
        </div>
    </section>
</div>
